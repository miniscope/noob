noob_id: docs-recursive-parent
noob_model: noob.tube.TubeSpecification
noob_version: 0.0.1
input:
  child_start:
    scope: tube
    type: int
    default: 5
  child_multiply:
    scope: process
    type: int
    default: 10

nodes:
  a:
    type: noob.testing.count_source
    params:
      start: 1

  b:
    type: tube
    params:
      tube: testing-recursive-child
    depends:
      - child_multiply_inner: a.index
      - child_multiply_input: input.child_multiply

  c:
    type: noob.testing.multiply
    params:
      right: 5
    depends:
    - left: b.value
  d:
    type: return
    depends:
      - index: a.index
      - child: b.value
      - parent: c.value
