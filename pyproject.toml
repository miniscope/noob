[project]
requires-python = ">=3.11"
dependencies = [
    "noob[dev] @ file:///${PROJECT_ROOT}/packages/noob",
    "nobes[dev] @ file:///${PROJECT_ROOT}/packages/nobes",
    "nobes-core @ file:///${PROJECT_ROOT}/packages/nobes-core",
    "nobes-files @ file:///${PROJECT_ROOT}/packages/nobes-files",
    "nobes-image @ file:///${PROJECT_ROOT}/packages/nobes-image",
    "nobes-input @ file:///${PROJECT_ROOT}/packages/nobes-input",
    "nobes-os @ file:///${PROJECT_ROOT}/packages/nobes-os",
    "nobes-video @ file:///${PROJECT_ROOT}/packages/nobes-video",
    "nobes-web @ file:///${PROJECT_ROOT}/packages/nobes-web",
]

[dependency-groups]
core = [
    "noob-core[dev] @ file:///${PROJECT_ROOT}/packages/noob-core",
]
dev = [
    "copier>=9.12.0",
    "towncrier>=24.8.0",
]
docs = [
    "sphinxcontrib-rust>=1.2.1",
]

[tool.pdm.workspace]
members = [
    "packages/noob",
    "packages/noob-core",
    "packages/nobes",
    "packages/nobes-core",
    "packages/nobes-files",
    "packages/nobes-image",
    "packages/nobes-input",
    "packages/nobes-os",
    "packages/nobes-video",
    "packages/nobes-web",
]

[tool.pdm.resolution]
# exclude from the lockfile so that in CI we can build once and share the wheel
excludes = ["noob-core"]


[tool.pdm.scripts]
test-noob.cmd = "pytest --cov=noob --cov-append"
test-noob.working_dir = "packages/noob"
test.composite = [
    "test-noob",
]

lint.composite = [
    "ruff check",
    "black . --diff",
]
format.composite = [
    "black .",
    "ruff check --fix",
]

docs = """sphinx-autobuild docs docs/_build/html  --ignore '*lib.md'"""
docs-js = """concurrently
  'npm --prefix js/ run watch:docs'
  'sphinx-autobuild docs docs/_build/html --ignore "*lib.md"'
"""
docs-build.cmd = "make html"
docs-build.working_dir = "docs"
docs-build-js = "npm --prefix js/ run build:docs"
docs-build-wheels = "bash scripts/build-docs-wheels.sh"

docs-test.composite = [
    "rm -rf ./docs/_build || true",
    "docs-build-js",
    "docs-build",
]
docs-test.env = {SPHINXOPTS = "-W --keep-going"}

mypy = "mypy"
benchmark.cmd = "pytest tests/bench.py --codspeed --timeout=15"
benchmark.working_dir = "packages/noob"
new_nobes = "copier copy templates/nobes packages"
render_schema = "python scripts/render_schema.py"
changelog = "python scripts/changelog.py"


[tool.towncrier]
# One config for every package in the monorepo. Each package's fragments and
# rendered changelog live together in `changelog/<package>/`, and the package is
# selected per-invocation with `--dir`:
#
#   towncrier build --config pyproject.toml --dir changelog/noob --version 1003.0.0
#
# Use `scripts/changelog.py` (`pdm run changelog`) rather than calling towncrier
# directly, so neither can be forgotten.
#
# `package`/`name` are empty because there is more than one of each.
package = ""
name = ""
# relative to `--dir`, i.e. `changelog/<package>/`
directory = "."
filename = "CHANGELOG.md"
template = "../_template.md"
ignore = ["CHANGELOG.md"]
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## v{version} - {project_date}"
issue_format = "[`#{issue}`](https://github.com/miniscope/noob/pull/{issue})"
underlines = ["", "", ""]
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "perf"
name = "Perf"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Docs"
showcontent = true

[[tool.towncrier.type]]
directory = "ci"
name = "CI"
showcontent = true

[tool.black]
target-version = ["py311", "py312", "py313"]
line-length = 100

[tool.ruff]
target-version = "py311"
include = ["packages/**/*.py", "tests/**/*.py", "docs/_ext/**/*.py", "**/pyproject.toml"]
exclude = ["docs", "templates"]
line-length = 100

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # annotations
    "ANN",
    # no debugger
    "T10",
    ## ----------
    # pydocstyle
    # indentation
    "D207", "D208",
    # whitespace
    "D210", "D211",
    # emptiness
    "D419",
    # snake case function name
    "N802",
    # FastAPI
    "FAST",
    # SQLi and Autoescaping in templates
    "S608", "S701",
]

ignore = [
    #"special" methods like `__init__` don't need to be annotated
    "ANN204",
    # any types are semantically valid actually sometimes
    "ANN401",
    # explicit strict arg for zip
    "B905",
    # docstrings for __init__
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/conftest.py" = [
    # allow unused imports - fixtures
    "F401",
    # allow star import of fixtures
    "F403",
]
"**/tests/**/test_*" = [
    # don't require annotating fixture types in test functions
    "ANN001", "ANN201",
    # allow unused variables, also normal in tests
    "F841",
]
"**/pdm_build.py" = [
    "ANN001", "ANN201", "D"
]

[tool.ruff.lint.isort]
known-first-party = ["noob", "nobes"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages"
packages = ["noob", "nobes", "noob_core"]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
show_error_context = true
show_column_numbers = true
show_error_code_links = true
strict_equality = true
pretty = true
color_output = true
plugins = ['pydantic.mypy']

[tool.coverage.report]
omit = [
    "*/testing/*"
]
