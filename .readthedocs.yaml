# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
    nodejs: "24"
    rust: "1.96"
  jobs:
    pre_install:
      - python -m pip install pdm pyodide-build
      - cargo install sphinx-rustdocgen --root /home/docs/.asdf
    install:
      - npm --prefix js/ ci
      - VIRTUAL_ENV=$(dirname $(dirname $(which python))) pdm install --with docs --with dev
      - VIRTUAL_ENV=$(dirname $(dirname $(which python))) pdm run python -m ensurepip
      - VIRTUAL_ENV=$(dirname $(dirname $(which python))) pdm run python -m pip install ./packages/noob-core
    pre_build:
      - VIRTUAL_ENV=$(dirname $(dirname $(which python))) pdm run docs-build-js
      - |
        set -eu
        EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)
        RUST_TOOLCHAIN=$(pyodide config get rust_toolchain)
        git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
        ~/emsdk/emsdk install "${EMSCRIPTEN_VERSION}"
        ~/emsdk/emsdk activate "${EMSCRIPTEN_VERSION}"
        rustup toolchain install "${RUST_TOOLCHAIN}"
        rustup target add wasm32-unknown-emscripten --toolchain "${RUST_TOOLCHAIN}"
        # emsdk_env.sh only fails because it can't locate itself under dash; do
        # its actual work (apply the emsdk env) directly, which is POSIX-clean
        eval "$(~/emsdk/emsdk construct_env)"
        VIRTUAL_ENV=$(dirname $(dirname $(which python))) pdm run docs-build-wheels
